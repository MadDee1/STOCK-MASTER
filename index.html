<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STOCK MASTER PRO - V11.11.5 (Full Audit Log)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f8fafc; }
        .stock-card { transition: all 0.2s ease; border: 1px solid #e2e8f0; position: relative; }
        .stock-card:hover { border-color: #6366f1; transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
        .btn-primary { background: linear-gradient(135deg, #4f46e5 0%, #3730a3 100%); }
        .sync-pulse { animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .4; } }
        .out-of-stock-animate { animation: blink 1.5s infinite; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
        .hidden { display: none !important; }
        .modal-overlay { z-index: 5000; backdrop-filter: blur(4px); }
    </style>
</head>
<body class="text-slate-900 pb-12">

    <div class="w-full max-w-md bg-white rounded-[2.5rem] p-8 shadow-2xl text-center">
        <img src="Logologin.PNG" alt="Logo" class="h-20 mx-auto object-contain mb-4">
        <p class="text-slate-400 text-xs font-bold uppercase mb-8 tracking-widest">ระบบบริหารคลังวัสดุ v11.11.5</p>
        <div class="flex bg-slate-100 p-1.5 rounded-2xl mb-8">
            <button id="tab-login" onclick="AppStore.switchAuth('login')" class="flex-1 py-2.5 text-xs font-black rounded-lg bg-white shadow text-indigo-600">เข้าสู่ระบบ</button>
            <button id="tab-register" onclick="AppStore.switchAuth('register')" class="flex-1 py-2.5 text-xs font-bold rounded-lg text-slate-400">ลงทะเบียน</button>
        </div>
        <div class="space-y-4 text-left">
            <input type="text" id="auth-user" placeholder="ชื่อผู้ใช้งาน" class="w-full p-4 bg-slate-50 border border-slate-100 rounded-2xl text-sm font-bold outline-none focus:ring-2 focus:ring-indigo-500">
            <input type="password" id="auth-pass" placeholder="รหัสผ่าน" class="w-full p-4 bg-slate-50 border border-slate-100 rounded-2xl text-sm font-bold outline-none focus:ring-2 focus:ring-indigo-500">
            <div id="org-selection-wrapper" style="display: none;">
                <select id="orgName" class="w-full p-4 bg-slate-50 border border-slate-100 rounded-2xl text-sm font-bold outline-none appearance-none">
                    <option value="" disabled selected>-- เลือกหน่วยงานสังกัด --</option>
                    <option value="รพ.สต.ปะนาเระ">รพ.สต.ปะนาเระ</option>
                    <option value="รพ.สต.บ้านท่าทราย">รพ.สต.บ้านท่าทราย</option>
                    <option value="รพ.สต.บ้านนอก">รพ.สต.บ้านนอก</option>
                    <option value="รพ.สต.ดอน">รพ.สต.ดอน</option>
                    <option value="รพ.สต.ควน">รพ.สต.ควน</option>
                    <option value="รพ.สต.ท่าน้ำ">รพ.สต.ท่าน้ำ</option>
                    <option value="รพ.สต.บ้านสุเหร่า">รพ.สต.บ้านสุเหร่า</option>
                    <option value="รพ.สต.คอกกระบือ">รพ.สต.คอกกระบือ</option>
                    <option value="รพ.สต.พ่อมิ่ง">รพ.สต.พ่อมิ่ง</option>
                    <option value="รพ.สต.บางมะรวด">รพ.สต.บางมะรวด</option>
                    <option value="รพ.สต.ศาลาหยุดพระ">รพ.สต.ศาลาหยุดพระ</option>
                    <option value="รพ.สต.บ้านน้ำบ่อ">รพ.สต.บ้านน้ำบ่อ</option>
                    <option value="รพ.สต.บ้านเตราะหัก">รพ.สต.บ้านเตราะหัก</option>
                    <option value="รพ.สต.บ้านกลาง">รพ.สต.บ้านกลาง</option>
                </select>
            </div>
            <button onclick="AppStore.handleAuth()" id="auth-btn" class="w-full py-4 btn-primary text-white rounded-2xl font-black text-sm shadow-lg mt-4">เข้าสู่ระบบ</button>

    <header class="max-w-7xl mx-auto px-6 py-8">
        <div class="flex flex-col md:flex-row justify-between items-center gap-6">
            <div><h1 class="text-3xl font-black text-slate-900 tracking-tight">คลังวัสดุ</h1><p class="text-slate-400 text-sm font-medium">ระบบจัดการวัสดุ</p></div>

            <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm"><p class="text-[10px] font-black text-indigo-500 uppercase mb-1">เบิกวันนี้</p><p id="stat-out-today" class="text-3xl font-black text-indigo-500">0</p></div>

                <input type="text" id="searchInput" oninput="AppStore.render()" placeholder="ค้นหาชื่อพัสดุ..." class="flex-1 px-4 py-3 bg-slate-50 rounded-xl text-sm font-bold outline-none focus:bg-white transition-all">
                <select id="filterCategory" onchange="AppStore.render()" class="w-48 p-3 bg-slate-50 rounded-xl text-sm font-bold border-none outline-none cursor-pointer"></select>
            </div>
            <div id="inventory-list" class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-5"></div>
            <div id="empty-state" class="py-24 text-center border-2 border-dashed border-slate-200 rounded-[3rem] hidden bg-slate-50/50">📦 ไม่พบข้อมูล</div>
        </div>
        <div class="lg:col-span-1">
            <div class="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-xl sticky top-24">
                <div class="bg-slate-800 p-5 text-white text-xs font-black">📋 ประวัติกิจกรรมล่าสุด (ทุกรายการ)</div>

                <div><label class="text-[10px] font-black text-rose-400 uppercase ml-1">แจ้งเตือนขั้นต่ำ</label><input type="number" id="itemMin" value="5" class="w-full p-4 bg-slate-50 border rounded-xl font-bold"></div>

        <h3 class="text-2xl font-black mb-6 text-slate-800">ตั้งค่า & หมวดหมู่</h3>

            <label class="flex-1 py-3 bg-white border text-indigo-600 rounded-xl text-[10px] font-black uppercase text-center cursor-pointer shadow-sm">📂 Import<input type="file" class="hidden" accept=".json" onchange="AppStore.importBackup(this)"></label>

            <div class="flex gap-2 mb-4"><input type="text" id="newCatInput" placeholder="หมวดหมู่ใหม่..." class="flex-1 p-4 bg-slate-50 border rounded-xl font-bold text-sm outline-none"><button onclick="AppStore.addCat()" class="px-5 py-4 btn-primary text-white rounded-xl font-bold text-xs uppercase shadow-md">เพิ่ม</button></div>

<div id="confirmDeleteModal" class="modal-overlay fixed inset-0 bg-slate-900/80 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-[2.5rem] p-8 w-full max-w-sm text-center shadow-2xl border-b-8 border-rose-500">
        <div class="text-5xl mb-4">🗑️</div>
        <h3 class="text-xl font-black text-slate-800 mb-2">ยืนยันการลบ?</h3>
        <p class="text-slate-500 text-sm mb-6 text-center">คุณต้องการลบพัสดุ <br><span id="deleteItemName" class="font-black text-rose-600 underline text-lg"></span><br> ใช่หรือไม่?</p>
        <div class="space-y-3">
            <button onclick="AppStore.executeDelete()" class="w-full py-4 bg-rose-500 text-white rounded-2xl font-black shadow-lg hover:bg-rose-600 transition-all">ยืนยัน ลบทิ้ง</button>
            <button onclick="AppStore.closeModal('confirmDeleteModal')" class="w-full py-3 text-slate-400 font-bold hover:text-slate-600">ยกเลิก</button>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAd7xCHaKXUBtam9I3bDDd3JSKk0EOxsho",
        authDomain: "mystockapp-ab21b.firebaseapp.com",
        projectId: "mystockapp-ab21b",
        storageBucket: "mystockapp-ab21b.firebasestorage.app",
        messagingSenderId: "1063086099094",
        appId: "1:1063086099094:web:4047b82b9ee0166febd0b7"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const appId = 'stock-v11-9-9';
    const userRegistryRef = doc(db, 'artifacts', appId, 'auth', 'userRegistry');

    let state = { inventory: [], categories: ["ทั่วไป"], history: [], currentUser: null, currentOrg: null, authMode: 'login', deleteTarget: null };
    let activeDocRef = null;

    const store = (() => {
        async function init() {
            const session = localStorage.getItem('STK_SESS_V11_7');
            const sessionOrg = localStorage.getItem('STK_ORG_V11_7');
            onAuthStateChanged(auth, async (user) => {
                if (!user) await signInAnonymously(auth);
                else if (session && sessionOrg) startApp(session, sessionOrg);
                else document.getElementById('auth-screen').classList.remove('hidden');
            });
        }

        function startApp(username, org) {
            state.currentUser = username; state.currentOrg = org;
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('main-app').classList.remove('hidden');
            document.getElementById('user-display').innerText = `${username} (${org})`;
            activeDocRef = doc(db, 'artifacts', appId, 'organizations', org, 'state', 'main');
            onSnapshot(activeDocRef, (snap) => {
                if (snap.exists()) {
                    const data = snap.data();
                    state.inventory = data.inventory || [];
                    state.categories = data.categories || ["ทั่วไป"];
                    state.history = data.history || [];
                    updateUI(); setSyncStatus('online');
                } else persist();
            });
        }

        async function persist() {
            if (!activeDocRef) return;
            await setDoc(activeDocRef, { inventory: state.inventory, categories: state.categories, history: state.history, orgName: state.currentOrg }, { merge: true });
        }

        function updateUI() {
            renderInventory(); renderHistory(); renderCats(); updateStats();
        }

        function updateStats() {
            const today = new Date().toDateString();
            const histToday = state.history.filter(h => new Date(h.timestamp).toDateString() === today);
            document.getElementById('stat-total').innerText = state.inventory.length;
            document.getElementById('stat-out').innerText = state.inventory.filter(i => i.stock <= 0).length;
            document.getElementById('stat-low').innerText = state.inventory.filter(i => i.stock > 0 && i.stock <= (i.min || 5)).length;
            document.getElementById('stat-in-today').innerText = histToday.filter(h => h.type === 'in').length;
            document.getElementById('stat-out-today').innerText = histToday.filter(h => h.type === 'out').length;
        }

        function renderInventory() {
            const list = document.getElementById('inventory-list');
            const search = (document.getElementById('searchInput')?.value || '').toLowerCase();
            const catF = document.getElementById('filterCategory')?.value || 'all';
            const filtered = state.inventory.filter(i => {
                const sMatch = i.name.toLowerCase().includes(search);
                const cMatch = (catF === 'all' || i.category === catF);
                return sMatch && cMatch;
            });
            if (filtered.length === 0) { list.innerHTML = ''; document.getElementById('empty-state').classList.remove('hidden'); return; }
            document.getElementById('empty-state').classList.add('hidden');
            list.innerHTML = filtered.map(item => `
                <div class="stock-card bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
                    <div class="flex justify-between items-start mb-2">
                        <span class="text-[9px] font-black uppercase px-2 py-1 bg-indigo-50 text-indigo-500 rounded-lg">${item.category}</span>
                        <div class="flex gap-1">
                            <button onclick="AppStore.editItem('${item.id}')" class="p-1.5 text-slate-300 hover:text-indigo-500">✏️</button>
                            <button onclick="AppStore.requestDelete('${item.id}')" class="p-1.5 text-slate-300 hover:text-rose-500">🗑️</button>
                        </div>
                    </div>
                    <h4 class="font-bold text-slate-800 my-4 truncate">${item.name}</h4>
                    <div class="${item.stock <= 0 ? 'bg-rose-50 border-rose-200' : 'bg-slate-50 border-slate-100'} p-4 rounded-xl border mb-4 text-center">
                        <span class="text-3xl font-black ${item.stock <= 0 ? 'text-rose-600' : (item.stock <= (item.min || 5) ? 'text-amber-500' : 'text-slate-800')}">${item.stock}</span>
                        <span class="text-xs font-bold text-slate-400">${item.unit}</span>
                        ${item.stock <= 0 ? '<p class="text-[9px] font-black text-rose-500 uppercase mt-1 out-of-stock-animate">⚠️ พัสดุหมด</p>' : ''}
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <button onclick="AppStore.openAction('${item.id}', 'out')" class="py-2 bg-rose-500 text-white rounded-lg text-[10px] font-black uppercase shadow-md hover:bg-rose-600">เบิกออก</button>
                        <button onclick="AppStore.openAction('${item.id}', 'in')" class="py-2 bg-emerald-500 text-white rounded-lg text-[10px] font-black uppercase shadow-md hover:bg-emerald-600">รับเข้า</button>
                    </div>
                </div>`).join('');
        }

        // 🟢 กู้คืนระบบประวัติแบบ Full History
        function renderHistory() {
            const list = document.getElementById('history-list');
            list.innerHTML = state.history.slice(0, 100).map(log => {
                let color = "text-slate-400";
                if(log.type === 'in' || log.type === 'create') color = "text-emerald-500";
                if(log.type === 'out' || log.type === 'delete') color = "text-rose-500";
                if(log.type === 'edit') color = "text-amber-500";
                const dFull = log.timestamp ? new Date(log.timestamp).toLocaleString('th-TH', {day:'numeric', month:'short', hour:'2-digit', minute:'2-digit', second:'2-digit'}) : '-';
                return `
                <div class="p-4 hover:bg-slate-50 border-b border-slate-50 last:border-0">
                    <p class="text-xs font-black text-slate-800 truncate">${log.item}</p>
                    <div class="flex justify-between items-center mt-1">
                        <span class="text-[9px] font-bold ${color} uppercase">${log.action_text || log.type} ${log.amount || ''}</span>
                        <span class="text-[8px] font-bold text-slate-300 uppercase">${log.user} | ${dFull}</span>
                    </div>
                </div>`;
            }).join('');
        }

        function renderCats() {
            const filter = document.getElementById('filterCategory');
            const input = document.getElementById('itemCat');
            const list = document.getElementById('cat-list');
            if(!filter || !input || !list) return;
            const opt = state.categories.map(c => `<option value="${c}">${c}</option>`).join('');
            filter.innerHTML = `<option value="all">ทุกหมวดหมู่</option>` + opt;
            input.innerHTML = opt;
            list.innerHTML = state.categories.map(c => `<div class="flex justify-between items-center p-2 bg-slate-50 rounded-lg text-xs font-bold mb-1"><span>${c}</span><button onclick="AppStore.deleteCat('${c}')" class="text-rose-300 hover:text-rose-600 transition-all">✕</button></div>`).join('');
        }

        function setSyncStatus(s) {
            const dot = document.getElementById('sync-dot');
            if(dot) dot.className = s === 'online' ? "w-1.5 h-1.5 rounded-full bg-emerald-500 sync-pulse" : "w-1.5 h-1.5 rounded-full bg-rose-500";
        }

        return {
            init, render: renderInventory, logout: () => { localStorage.clear(); location.reload(); },
            switchAuth: (m) => {
                state.authMode = m; const isLogin = m === 'login';
                document.getElementById('auth-btn').innerText = isLogin ? 'เข้าสู่ระบบ' : 'ยืนยันลงทะเบียน';
                document.getElementById('tab-login').className = isLogin ? 'flex-1 py-2.5 text-xs font-black rounded-lg bg-white shadow text-indigo-600' : 'flex-1 py-2.5 text-xs font-bold rounded-lg text-slate-400';
                document.getElementById('tab-register').className = !isLogin ? 'flex-1 py-2.5 text-xs font-black rounded-lg bg-white shadow text-indigo-600' : 'flex-1 py-2.5 text-xs font-bold rounded-lg text-slate-400';
                document.getElementById('org-selection-wrapper').style.display = isLogin ? 'none' : 'block';
            },
            handleAuth: async () =>  {
                const u = document.getElementById('auth-user').value.trim(); 
                const p = document.getElementById('auth-pass').value; // รับค่ารหัสผ่านใหม่
                const org = document.getElementById('orgName')?.value;

                if(!u || !p) return alert("❌ กรุณากรอกทั้งชื่อผู้ใช้และรหัสผ่าน");

                const snap = await getDoc(userRegistryRef); 
                const dbUsers = snap.exists() ? (snap.data().users || []) : [];

                if(state.authMode === 'register') {
                    if(!org) return alert("❌ กรุณาเลือกหน่วยงานสังกัดก่อนลงทะเบียน!");
                    const exists = dbUsers.find(x => x.u === u);
                    if(exists) return alert("❌ ชื่อผู้ใช้งานนี้ถูกใช้ไปแล้ว กรุณาใช้ชื่ออื่น");

                    // 🟢 บันทึกครบทั้ง u (ชื่อ), p (รหัส), และ org (หน่วยงาน)
                    dbUsers.push({ u, p, org }); 
                    await setDoc(userRegistryRef, { users: dbUsers }, { merge: true });
                    
                    alert(`✅ ลงทะเบียนสำเร็จสำหรับ ${org}!\nคุณสามารถเข้าสู่ระบบได้ทันที`); 
                    store.switchAuth('login');
                } else {
                    // 🟢 ตรวจสอบความถูกต้องทั้ง Username และ Password
                    const found = dbUsers.find(x => x.u === u && x.p === p); 
                    if(!found) return alert("❌ ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง");

                    localStorage.setItem('STK_SESS_V11_7', u); 
                    localStorage.setItem('STK_ORG_V11_7', found.org); 
                    startApp(u, found.org);
                }
            },
            saveItem: async () => {
                const id = document.getElementById('editId').value; const name = document.getElementById('itemName').value.trim(); const qty = parseInt(document.getElementById('itemQty').value) || 0; const unit = document.getElementById('itemUnit').value.trim() || 'ชิ้น'; const cat = document.getElementById('itemCat').value; const min = parseInt(document.getElementById('itemMin').value) || 5;
                if(!name) return;
                const existing = state.inventory.find(x => x.name.toLowerCase() === name.toLowerCase());
                if (id) {
                    const idx = state.inventory.findIndex(x => x.id === id);
                    state.inventory[idx] = { ...state.inventory[idx], name, stock: qty, unit, category: cat, min };
                    state.history.unshift({ item: name, type: 'edit', action_text: 'แก้ไขวัสดุ', user: state.currentUser, timestamp: new Date().toISOString() });
                } else if (existing) {
                    existing.stock += qty;
                    state.history.unshift({ item: name, type: 'in', amount: qty, user: state.currentUser, timestamp: new Date().toISOString(), action_text: 'บวกยอดสะสม' });
                    alert(`📥 พบชื่อวัสดุซ้ำ! บวกยอดเดิมให้เรียบร้อยแล้ว`);
                } else {
                    state.inventory.push({ id: 'ITM-'+Date.now(), name, stock: qty, unit, category: cat, min });
                    state.history.unshift({ item: name, type: 'create', amount: qty, user: state.currentUser, timestamp: new Date().toISOString(), action_text: 'เพิ่มใหม่' });
                }
                await persist(); document.getElementById('itemModal').classList.add('hidden');
            },
            openAction: (id, type) => {
                const item = state.inventory.find(x => x.id === id); document.getElementById('actionItemName').innerText = item.name;
                document.getElementById('actionLabel').innerText = type === 'in' ? 'รับเข้าวัสดุ' : 'เบิกออกวัสดุ';
                const btn = document.getElementById('confirmActionBtn');
                btn.innerText = type === 'in' ? 'ยืนยันรับเข้า' : 'ยืนยันเบิกออก';
                btn.className = type === 'in' ? 'flex-1 py-4 bg-emerald-500 text-white rounded-2xl font-black shadow-lg' : 'flex-1 py-4 bg-rose-500 text-white rounded-2xl font-black shadow-lg';
                window.activeAction = { id, type }; document.getElementById('actionModal').classList.remove('hidden');
            },
            confirmAction: async () => {
                const amt = parseInt(document.getElementById('actionAmount').value) || 0; const { id, type } = window.activeAction;
                const idx = state.inventory.findIndex(x => x.id === id);
                if (type === 'out' && state.inventory[idx].stock < amt) return alert("❌ ยอดคงเหลือไม่พอเบิก!");
                state.inventory[idx].stock += (type === 'in' ? amt : -amt);
                state.history.unshift({ item: state.inventory[idx].name, type, amount: amt, user: state.currentUser, timestamp: new Date().toISOString(), action_text: (type==='in'?'รับเข้า':'เบิกออก') });
                await persist(); document.getElementById('actionModal').classList.add('hidden');
            },
            editItem: (id) => {
                const item = state.inventory.find(x => x.id === id);
                document.getElementById('editId').value = item.id; document.getElementById('itemName').value = item.name;
                document.getElementById('itemQty').value = item.stock; document.getElementById('itemUnit').value = item.unit;
                document.getElementById('itemCat').value = item.category; document.getElementById('itemMin').value = item.min || 5;
                document.getElementById('modalTitle').innerText = 'แก้ไขข้อมูลวัสดุ'; document.getElementById('itemModal').classList.remove('hidden');
            },
            requestDelete: (id) => {
                state.deleteTarget = id; const item = state.inventory.find(x => x.id === id);
                document.getElementById('deleteItemName').innerText = item.name;
                document.getElementById('confirmDeleteModal').classList.remove('hidden');
            },
            executeDelete: async () => {
                const item = state.inventory.find(x => x.id === state.deleteTarget);
                state.history.unshift({ item: item.name, type: 'delete', action_text: 'ลบพัสดุ', user: state.currentUser, timestamp: new Date().toISOString() });
                state.inventory = state.inventory.filter(x => x.id !== state.deleteTarget);
                await persist(); document.getElementById('confirmDeleteModal').classList.add('hidden');
            },
            // 🟢 ระบบรายงาน Excel ฉบับสมบูรณ์ (Timestamp ละเอียด)
            triggerExport: () => {
                let csv = "\ufeff=== รายงานสถานะคลังพัสดุ ===\nหมวดหมู่,ชื่อพัสดุ,จำนวนคงเหลือ,หน่วยนับ,สถานะ\n";
                state.inventory.forEach(i => csv += `"${i.category}","${i.name}",${i.stock},"${i.unit}","${i.stock<=0?'หมด':(i.stock<=i.min?'ใกล้หมด':'ปกติ')}"\n`);
                csv += "\n\n=== ประวัติกิจกรรมฉบับละเอียด (Audit Log) ===\nวันที่/เวลา,ผู้ทำรายการ,รายการพัสดุ,กิจกรรม,จำนวน\n";
                state.history.forEach(h => {
                    const dFull = new Date(h.timestamp).toLocaleString('th-TH');
                    csv += `"${dFull}","${h.user}","${h.item}","${h.action_text || h.type}",${h.amount || '-'}\n`;
                });
                const b = new Blob([csv], { type: 'text/csv;charset=utf-8;' }); const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = `รายงานละเอียด_${state.currentOrg}_${new Date().toLocaleDateString('th-TH')}.csv`; a.click();
            },
            addCat: async () => {
                const v = document.getElementById('newCatInput').value.trim();
                if(v && !state.categories.includes(v)) { 
                    state.categories.push(v); 
                    state.history.unshift({ item: v, type: 'edit', action_text: 'เพิ่มหมวดหมู่', user: state.currentUser, timestamp: new Date().toISOString() });
                    await persist(); document.getElementById('newCatInput').value = ''; 
                }
            },
            deleteCat: async (c) => { 
                if(state.categories.length > 1) { 
                    state.categories = state.categories.filter(x => x !== c); 
                    state.history.unshift({ item: c, type: 'edit', action_text: 'ลบหมวดหมู่', user: state.currentUser, timestamp: new Date().toISOString() });
                    await persist(); 
                } 
            },
            exportBackup: () => { const b = new Blob([JSON.stringify(state)]); const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = `BACKUP_${state.currentOrg}.json`; a.click(); },
            importBackup: (input) => { const r = new FileReader(); r.onload = async (e) => { const d = JSON.parse(e.target.result); state.inventory = d.inventory; state.categories = d.categories; state.history = d.history || []; await persist(); alert("กู้คืนสำเร็จ!"); }; r.readAsText(input.files[0]); },
            openItemModal: () => { document.getElementById('editId').value = ''; document.getElementById('itemName').value = ''; document.getElementById('itemQty').value = '0'; document.getElementById('modalTitle').innerText = 'เพิ่มวัสดุใหม่'; document.getElementById('itemModal').classList.remove('hidden'); },
            openCategoryModal: () => document.getElementById('categoryModal').classList.remove('hidden'),
            closeModal: (id) => document.getElementById(id).classList.add('hidden')
        };
    })();

    window.AppStore = store; window.onload = () => store.init();
</script>
</body>
</html>
